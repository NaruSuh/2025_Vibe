<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간 임상심리학 연구 동향</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .date {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border-left: 4px solid #4facfe;
            background: #f8f9ff;
            border-radius: 5px;
        }
        .section-title {
            color: #4facfe;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .paper-item, .video-item, .topic-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .paper-title, .video-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .paper-authors, .video-channel {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .paper-abstract {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 10px;
        }
        .trending-badge {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
        }
        .personalized-note {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        .no-content {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 주간 임상심리학 연구 동향</h1>
            <div class="date">{date}</div>
        </div>

        {personalized_note}

        <div class="section">
            <div class="section-title">📄 최신 연구 논문</div>
            {papers_content}
        </div>

        <div class="section">
            <div class="section-title">🎬 추천 동영상</div>
            {videos_content}
        </div>

        <div class="section">
            <div class="section-title">📈 트렌딩 주제</div>
            {trending_content}
        </div>

        <div class="footer">
            <p>📧 Clinical Psychology Research Hub<br>
            이 이메일은 주간 연구 동향 구독 서비스입니다.</p>
            <p><small>구독 해지를 원하시면 회신해 주세요.</small></p>
        </div>
    </div>
</body>
</html>
